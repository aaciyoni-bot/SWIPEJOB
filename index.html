<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RELJOB — Work Abroad. Change Your Life. Relocation Jobs for Zambia & Nigeria</title>
<meta name="description" content="Verified relocation jobs across the world. Flights, visa and housing arranged. Built for workers from Zambia and Nigeria. Salaries from 26,000 ZMW/month. Couples, families and single mothers welcome." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    /* Neutrals — warm, tinted toward the brand */
    --bg:#fbfaf7;
    --surface:#ffffff;
    --surface-2:#f5f3ee;
    --line:#e7e3da;
    --ink:#14110c;
    --ink-2:#4a4436;
    --muted:#7c7566;
    /* Brand — deep trustworthy indigo + hopeful sunrise amber */
    --brand:#1d3a8a;
    --brand-2:#2c56c9;
    --brand-ink:#0d1f52;
    --accent:#f6a623;
    --accent-2:#ff7a45;
    --gold:#d99a1c;
    --success:#0f8a5f;
    --success-bg:#e6f5ee;
    /* radii + shadow system */
    --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:34px;
    --sh-1:0 1px 2px rgba(20,17,12,.05), 0 1px 3px rgba(20,17,12,.06);
    --sh-2:0 4px 12px rgba(20,17,12,.07), 0 2px 4px rgba(20,17,12,.05);
    --sh-3:0 18px 44px -12px rgba(20,17,12,.22);
    --sh-brand:0 16px 40px -12px rgba(29,58,138,.45);
    --maxw:1180px;
    --font-head:'Plus Jakarta Sans',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.12;letter-spacing:-.02em;margin:0;color:var(--ink)}
  p{margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  img{display:block;max-width:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2)}
  .imgfallback{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e9edfb,#f6ede0);font-size:2.4rem}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:.55rem;font-weight:700;font-size:15px;
    padding:14px 26px;border-radius:999px;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,filter .18s ease;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;box-shadow:var(--sh-brand)}
  .btn-primary:hover{filter:brightness(1.07);transform:translateY(-2px)}
  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3a1d00;box-shadow:0 14px 34px -12px rgba(246,166,35,.7)}
  .btn-accent:hover{filter:brightness(1.05);transform:translateY(-2px)}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-1)}
  .btn-ghost:hover{border-color:var(--brand-2);color:var(--brand-2)}
  .btn-lg{padding:17px 34px;font-size:16px}
  .btn-block{width:100%;justify-content:center}

  /* ---------- Header ---------- */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;gap:20px;height:70px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:22px;letter-spacing:-.03em}
  .logo .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:var(--sh-brand)}
  .logo b{color:var(--brand)}
  .logo .go-accent{color:var(--accent-2)}
  .logo-tag{font-family:var(--font-body);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:10px;margin-inline-start:2px}
  @media(max-width:900px){.logo-tag{display:none}}
  .nav-links{display:flex;gap:26px;margin-inline-start:14px}
  .nav-links a{font-size:14.5px;font-weight:600;color:var(--ink-2);transition:color .15s}
  .nav-links a:hover{color:var(--brand-2)}
  .nav-spacer{flex:1}
  .sub-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--success);background:var(--success-bg);padding:8px 14px;border-radius:999px}
  .hamburger{display:none;font-size:26px;color:var(--ink);padding:6px}
  .gbtn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2);box-shadow:var(--sh-1);transition:border .15s,transform .15s}
  .gbtn:hover{border-color:var(--brand-2);transform:translateY(-1px)}
  .user-pill{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;background:var(--surface-2);padding:5px 14px 5px 5px;border-radius:999px}
  .user-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .user-pill .avm{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .user-pill .so{font-size:12px;color:var(--muted);font-weight:600}
  .user-pill .so:hover{color:var(--brand-2)}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;padding:64px 0 40px;
    background:
      radial-gradient(1200px 520px at 82% -8%,rgba(246,166,35,.20),transparent 60%),
      radial-gradient(900px 500px at 6% 4%,rgba(44,86,201,.14),transparent 55%),
      linear-gradient(180deg,#fbfaf7 0%,#f7f4ee 100%);}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
  .hero h1{font-size:clamp(34px,5vw,58px);font-weight:800}
  .hero h1 .grad{background:linear-gradient(120deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{margin-top:20px;font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);max-width:36ch}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .flags{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .flags .fl{font-size:20px}
  .hero-stats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
  .hero-stats .st b{display:block;font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--brand)}
  .hero-stats .st span{font-size:13px;color:var(--muted);font-weight:600}

  /* hero collage */
  .collage{position:relative;height:480px}
  .collage .ph{position:absolute;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-3);border:5px solid #fff}
  .collage .ph img,.collage .ph .imgfallback{width:100%;height:100%;object-fit:cover}
  .ph.a{width:58%;height:64%;inset-inline-start:0;top:0;z-index:2}
  .ph.b{width:44%;height:50%;inset-inline-end:0;top:8%;z-index:3}
  .ph.c{width:50%;height:46%;inset-inline-start:8%;bottom:0;z-index:4}
  .ph.d{width:38%;height:40%;inset-inline-end:2%;bottom:6%;z-index:5}
  .badge-float{position:absolute;z-index:6;background:#fff;border-radius:14px;box-shadow:var(--sh-3);padding:11px 15px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
  .badge-float .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .badge-float.one{top:-2%;inset-inline-end:16%}
  .badge-float.two{bottom:16%;inset-inline-start:-4%}

  /* ---------- Trust strip ---------- */
  .trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
  .trust-inner{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;padding:20px 0}
  .trust .ti{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .trust .ti .ic{font-size:20px}

  /* ---------- Sections ---------- */
  section{padding:80px 0}
  .sec-head{max-width:720px;margin-bottom:40px}
  .sec-head h2{font-size:clamp(27px,3.5vw,40px);font-weight:800;margin-top:12px}
  .sec-head p{margin-top:14px;color:var(--ink-2);font-size:17px}

  /* category chips */
  .cats{display:flex;gap:11px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    font-size:14px;font-weight:600;color:var(--ink-2);transition:all .16s;box-shadow:var(--sh-1)}
  .chip:hover{border-color:var(--brand-2);color:var(--brand-2);transform:translateY(-1px)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
  .chip .em{font-size:16px}

  /* filter bar */
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh-1)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .inp,select.inp{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-family:inherit;font-size:14.5px;color:var(--ink);min-width:150px;transition:border .15s,box-shadow .15s}
  .inp:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(44,86,201,.15)}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap .inp{width:100%;padding-inline-start:38px}
  .search-wrap .mag{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .toggle-row{display:flex;gap:8px;flex-wrap:wrap}
  .tgl{font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:all .15s}
  .tgl.on{background:var(--brand-ink);color:#fff;border-color:var(--brand-ink)}
  .result-count{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:18px}

  /* job grid */
  .jobs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .jcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);
    display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease,border-color .2s;position:relative}
  .jcard:hover{transform:translateY(-4px);box-shadow:var(--sh-3);border-color:#dcd6c8}
  .jcard-top{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .jcat{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--brand-2);background:#eef2fd;padding:6px 11px;border-radius:999px}
  .jflag{font-size:15px;background:var(--surface-2);border-radius:9px;padding:5px 9px;font-weight:700;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
  .jcard h3{font-size:18px;font-weight:700;padding:14px 18px 2px;line-height:1.2}
  .jemp{padding:0 18px;color:var(--muted);font-size:13.5px;font-weight:600}
  .jsalary{margin:14px 18px 0;padding:12px 14px;border-radius:var(--r-sm);background:var(--success-bg);display:flex;align-items:baseline;justify-content:space-between}
  .jsalary.nohouse{background:#fff4e6}
  .jsalary .amt{font-family:var(--font-head);font-weight:800;font-size:19px;color:var(--success)}
  .jsalary.nohouse .amt{color:var(--gold)}
  .jsalary .per{font-size:12px;color:var(--muted);font-weight:600}
  .jtags{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px 0}
  .jtag{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
  .jtag.house{background:#e6f5ee;color:var(--success)}
  .jtag.nohouse{background:#fdeede;color:var(--gold)}
  .jtag.flight{background:#e9edfb;color:var(--brand-2)}
  .jtag.vac{background:#fbe9f4;color:#b23a86}
  .jtag.couple{background:#efe6fb;color:#7b3fd1}
  .jtag.kids{background:#e6f2fb;color:#2b7cc4}
  .jcard-foot{margin-top:auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line)}
  .jtags{min-height:30px}
  .photo-drop.err{border-color:var(--accent-2);background:#fdeede}
  .spin{display:inline-block;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
  .jcard-foot .posted{font-size:12px;color:var(--muted);font-weight:600}
  .apply-mini{font-size:13.5px;font-weight:700;color:#fff;background:var(--brand);padding:9px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .15s}
  .apply-mini:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .apply-mini.locked{background:var(--surface-2);color:var(--ink-2)}
  .load-more{display:flex;justify-content:center;margin-top:40px}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:3rem;margin-bottom:10px}

  /* program cards (couples / single mothers) */
  .prog{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
  .prog-media{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-3);aspect-ratio:4/3}
  .prog-media img,.prog-media .imgfallback{width:100%;height:100%;object-fit:cover}
  .prog-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:38px;box-shadow:var(--sh-2)}
  .prog-card h2{font-size:clamp(25px,3vw,36px);font-weight:800}
  .benefit{display:flex;gap:13px;align-items:flex-start;margin-top:18px}
  .benefit .bic{flex:none;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#eef2fd}
  .benefit b{font-size:15.5px;display:block}
  .benefit span{font-size:14px;color:var(--ink-2)}
  .alt{background:linear-gradient(180deg,#fff,#faf6ee)}

  /* how it works */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 24px;box-shadow:var(--sh-1);position:relative}
  .step .num{font-family:var(--font-head);font-weight:800;font-size:15px;color:#fff;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-brand)}
  .step h3{font-size:18px;margin-top:16px}
  .step p{margin-top:8px;color:var(--ink-2);font-size:14.5px}

  /* testimonials */
  .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--sh-1)}
  .tcard .quote{font-size:15.5px;color:var(--ink-2);line-height:1.65}
  .tcard .who{display:flex;align-items:center;gap:12px;margin-top:20px}
  .tcard .who .tavatar{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:16px}
  .tcard .who b{font-size:14.5px;display:block}
  .tcard .who span{font-size:13px;color:var(--muted)}
  .tcard .who .origin{font-size:12px;color:var(--brand-2);font-weight:600;margin-top:2px}
  .stars{color:var(--accent);font-size:14px;margin-bottom:12px}

  /* FAQ */
  .faq{max-width:800px;margin:0 auto}
  .qa{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh-1)}
  .qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 22px;font-family:var(--font-head);font-weight:700;font-size:16.5px;text-align:start;color:var(--ink)}
  .qa .ans{padding:0 22px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;color:var(--ink-2);font-size:15px}
  .qa.open .ans{max-height:320px;padding:0 22px 22px}
  .qa .pm{font-size:22px;color:var(--brand-2);transition:transform .25s}
  .qa.open .pm{transform:rotate(45deg)}

  /* CTA band */
  .cta-band{background:linear-gradient(120deg,var(--brand-ink),var(--brand-2));border-radius:var(--r-xl);padding:56px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-3)}
  .cta-band::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 80% 0,rgba(246,166,35,.35),transparent 60%);pointer-events:none}
  .cta-band h2{color:#fff;font-size:clamp(26px,3.4vw,40px);position:relative}
  .cta-band p{color:#d7dcf2;margin-top:14px;font-size:18px;position:relative}

  /* footer */
  footer{background:#0f0d09;color:#cdc7ba;padding:60px 0 28px;margin-top:10px}
  footer .fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:36px}
  footer h4{color:#fff;font-size:15px;margin-bottom:14px}
  footer a{display:block;color:#a9a293;font-size:14px;padding:5px 0;transition:color .15s}
  footer a:hover{color:#fff}
  footer .logo{color:#fff}
  footer .logo b{color:#8ea6f0}
  footer .disc{border-top:1px solid #2a271f;margin-top:34px;padding-top:20px;font-size:12.5px;color:#7c7566;line-height:1.6}
  footer .powered{margin-top:16px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6f6858}
  footer .powered b{color:#f6a623;font-weight:800}
  footer .legal-links{border-top:1px solid #2a271f;margin-top:20px;padding-top:18px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center}
  footer .legal-links a{color:#a9a293;font-size:13px;padding:0}
  footer .legal-links a:hover{color:#fff}
  .wa-fab{position:fixed;bottom:20px;inset-inline-end:20px;z-index:60;display:inline-flex;align-items:center;gap:9px;background:#25D366;color:#fff;font-weight:700;font-size:14.5px;padding:12px 18px 12px 15px;border-radius:999px;box-shadow:0 10px 26px -6px rgba(37,211,102,.6);transition:transform .18s ease,box-shadow .18s ease}
  .wa-fab:hover{transform:translateY(-2px);box-shadow:0 14px 30px -6px rgba(37,211,102,.7)}
  .wa-fab svg{width:22px;height:22px;flex:none}
  @media(max-width:560px){.wa-fab span{display:none}.wa-fab{padding:14px;border-radius:50%}}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(15,13,9,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--surface);border-radius:var(--r-lg);max-width:560px;width:100%;box-shadow:var(--sh-3);position:relative;animation:pop .24s cubic-bezier(.2,.9,.3,1.3);margin:auto}
  .modal.wide{max-width:640px}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal-head{position:relative;padding:26px 28px 0}

/* Charges the member's mobile money and waits for the PIN approval.
   Returns "paid" | "failed" | null (null = automatic collection unavailable,
   so the caller falls back to the lead-only flow instead of faking success). */
async function collectMembership(opts){
  const base=apiBase(); if(!base) return null;
  try{
    const res=await fetch(base+"/api/pay",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({depositId:opts.depositId,phone:opts.phone,provider:opts.provider,
        amount:opts.amount,country:opts.country})});

    if(!res.ok||data.simulated||data.unsupportedCountry||!data.tx_ref) return null;

      try{
        const s=await fetch(base+"/api/pay/status?tx_ref="+encodeURIComponent(data.tx_ref)).then(r=>r.json());
        if(s.status==="successful") return "paid";
        if(s.status==="failed"||s.status==="cancelled") return "failed";
      }catch(e){ /* transient — keep waiting */ }
    }
    return "failed";
  }catch(e){ console.warn("Automatic collection unavailable:",e); return null; }

}

const HERO_PHOTOS=["photo-1521737604893-d14cc237f11d","photo-1522202176988-66273c2fd55f","photo-1600880292203-757bb62b4baf","photo-1531123897727-8f129e1688ce"];
const CAT_IMG={farm:"photo-1500937386664-56d1dfef3854",hotel:"photo-1566073771259-6a8506099945",chef:"photo-1577219491135-ce391730fb2c",caregiver:"photo-1576091160399-112ba8d25d1d",construction:"photo-1504307651254-35680f356dfd",driver:"photo-1449965408869-eaa3f722e40d",cleaning:"photo-1581578731548-c64695cc6952",default:"photo-1521737604893-d14cc237f11d"};
const TESTI=[
  {name:"Grace Mwanza",role:"Caregiver in Israel 🇮🇱",from:"Lusaka",initials:"GM",color:"#1d3a8a",q:"I applied from Lusaka on a Sunday. Two weeks later I had my flight and visa sorted. Today I send money home every month.",r:5},
  {name:"Chanda Phiri",role:"Farm Worker in Portugal 🇵🇹",from:"Kitwe",initials:"CP",color:"#0f8a5f",q:"Housing is included so I save almost everything I earn. RELJOB made the whole process simple and clear.",r:5},
  {name:"Joyce & Peter Banda",role:"Couple · Hotel Staff in Cyprus 🇨🇾",from:"Ndola",initials:"JB",color:"#b23a86",q:"We travelled together and work at the same resort. Our daughter is with us and her school costs are covered. A real dream come true.",r:5},
];

function SmartImg({src,alt,fb}){
  const [err,setErr]=useState(false);
  if(err||!src) return <div className="imgfallback" aria-hidden="true">{fb||"🌍"}</div>;
  return <img src={src} alt={alt||""} loading="lazy" onError={()=>setErr(true)} />;
}

const fmt = n => n.toLocaleString("en-US");

/* ============================================================ APP ============ */
function App(){
  const [subscribed,setSubscribed]=useState(()=>localStorage.getItem("goojob_sub")==="1");
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("goojob_user")||"null");}catch(e){return null;}});
  const googleBtnRef=useRef(null);
  const [menu,setMenu]=useState(false);
  const [detail,setDetail]=useState(null);      // job object
  const [subOpen,setSubOpen]=useState(false);
  const [applyJob,setApplyJob]=useState(null);   // job to apply to
  const [success,setSuccess]=useState(null);     // {type,msg}
  const [postOpen,setPostOpen]=useState(false);  // employer "post a job" modal

  // filters
  const [cat,setCat]=useState("all");
  const [country,setCountry]=useState("all");
  const [ftype,setFtype]=useState("all");        // all|individual|couple|single
  const [q,setQ]=useState("");
  const [tFlight,setTFlight]=useState(false);
  const [tHouse,setTHouse]=useState(false);
  const [tVac,setTVac]=useState(false);
  const [visible,setVisible]=useState(24);

  useEffect(()=>{ if(subscribed) localStorage.setItem("goojob_sub","1"); },[subscribed]);

  // Google Identity Services — activates automatically once GOOGLE_CLIENT_ID is set
  useEffect(()=>{
    if(!GOOGLE_CLIENT_ID || user) return;
    let tries=0;
    const t=setInterval(()=>{
      tries++;
      const g=window.google&&window.google.accounts&&window.google.accounts.id;
      if(g){
        clearInterval(t);
        window.google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:(resp)=>{
          const p=decodeJwt(resp.credential);
          if(p){const u={name:p.name,given:p.given_name,email:p.email,picture:p.picture};setUser(u);localStorage.setItem("goojob_user",JSON.stringify(u));}
        }});
        if(googleBtnRef.current){
          googleBtnRef.current.innerHTML="";
          window.google.accounts.id.renderButton(googleBtnRef.current,{theme:"outline",size:"large",shape:"pill",text:"signin_with"});
        }
      }
      if(tries>40) clearInterval(t);
    },300);
    return ()=>clearInterval(t);
  },[user]);

  // Firebase Auth (shared Zed Zambia project). One account across every ORIZIS
  // Zambia site, and a membership bought on one phone is restored on the next.
  useEffect(()=>{
    if(!fbAuth) return;
    return fbAuth.onAuthStateChanged(async u=>{
      if(!u){ return; }
      const info={name:u.displayName||(u.email||"").split("@")[0],given:(u.displayName||"").split(" ")[0],
        email:u.email,picture:u.photoURL};
      setUser(info); localStorage.setItem("goojob_user",JSON.stringify(info));
      if(!fbDb) return;
      try{
        const snap=await fbDb.collection("goojob_members").doc(u.uid).get();
        if(snap.exists && snap.data().active) setSubscribed(true);
      }catch(e){ /* not fatal — they can still subscribe */ }
    });
  },[]);

  function signInGoogle(){
    if(!fbAuth) return;
    const p=new firebase.auth.GoogleAuthProvider();
    fbAuth.signInWithPopup(p).catch(e=>{
      setSuccess({title:"Could not sign in",msg:(e&&e.message)||"Please try again."});
    });
  }

  function signOut(){
    setUser(null); localStorage.removeItem("goojob_user");
    try{ if(fbAuth) fbAuth.signOut(); }catch(e){}
    try{ window.google.accounts.id.disableAutoSelect(); }catch(e){}
  }
  // lock body scroll when a modal is open
  useEffect(()=>{
    const open=detail||subOpen||applyJob||success||postOpen;
    document.body.style.overflow=open?"hidden":"";
  },[detail,subOpen,applyJob,success,postOpen]);

  const filtered=useMemo(()=>{
    const qq=q.trim().toLowerCase();
    return ALL_JOBS.filter(j=>{
      if(cat!=="all"&&j.cat!==cat) return false;
      if(country!=="all"&&j.country!==country) return false;
      if(ftype==="individual"&&j.type!=="individual") return false;
      if(ftype==="couple"&&j.type!=="couple") return false;
      if(ftype==="single"&&!j.singleMotherWelcome) return false;
      if(tFlight&&!j.flightVisa) return false;
      if(tHouse&&!j.housing) return false;
      if(tVac&&!j.vacation) return false;
      if(qq){
        const hay=(j.title+" "+j.employer+" "+j.country+" "+j.city+" "+j.catName).toLowerCase();
        if(!hay.includes(qq)) return false;
      }
      return true;
    });
  },[cat,country,ftype,q,tFlight,tHouse,tVac]);

  useEffect(()=>{setVisible(24);},[cat,country,ftype,q,tFlight,tHouse,tVac]);

  function onApplyClick(job){
    setDetail(null);
    if(subscribed) setApplyJob(job);
    else setSubOpen({intent:"apply",job});
  }
  function handleSubscribed(info){
    // `manual` means no money was actually collected (Nigeria, or the payments
    // backend was unreachable) — the team follows up. Never claim otherwise.
    const manual=!!(info&&info.manual);
    setSubscribed(true);
    const pending=subOpen&&subOpen.job;
    setSubOpen(false);
    if(pending) setTimeout(()=>setApplyJob(pending),120);
    else if(manual) setSuccess({title:"Request received ✅",msg:"We have your membership request. Our team will contact you on WhatsApp to complete the Mobile Money payment and activate your account. Meanwhile you can browse and prepare your profile."});
    else setSuccess({title:"You're subscribed! 🎉",msg:"Your Mobile Money payment went through and your RELJOB relocation membership is active. Browse the opportunities and send your profile — we'll submit your application to relevant opportunities on your behalf and our team will guide your next steps."});
  }

  const scrollTo=(id)=>{setMenu(false);const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth"});};

  return (
    <React.Fragment>
      {/* ---------------- NAV ---------------- */}
      <header className="nav">
        <div className="wrap nav-inner">
          <a href="#top" className="logo" onClick={e=>{e.preventDefault();scrollTo("top");}}>
            <span className="mark">✈</span><span>REL<span className="go-accent">JOB</span></span><span className="logo-tag">Relocation&nbsp;Jobs</span>
          </a>
          <nav className="nav-links">
            <a onClick={()=>scrollTo("jobs")}>Jobs</a>
            <a onClick={()=>scrollTo("couples")}>Couples</a>
            <a onClick={()=>scrollTo("single-mothers")}>Single Mothers</a>
            <a onClick={()=>scrollTo("how")}>How it works</a>
            <a onClick={()=>scrollTo("faq")}>FAQ</a>
            <a onClick={()=>setPostOpen(true)} style={{color:"var(--accent-2)",fontWeight:700}}>Post a job</a>
          </nav>
          <div className="nav-spacer"></div>
          {user
            ? <span className="user-pill">
                {user.picture ? <img src={user.picture} alt="" referrerPolicy="no-referrer" /> : <span className="avm">{(user.given||user.name||"?").charAt(0)}</span>}
                {user.given||user.name}
                <button className="so" onClick={signOut}>Sign out</button>
              </span>
            : (fbAuth
                ? <button className="gbtn" onClick={signInGoogle}>{GLOGO} Sign in with Google</button>
                : (GOOGLE_CLIENT_ID
                    ? <div ref={googleBtnRef}></div>
                    : <button className="gbtn" onClick={()=>setSuccess({title:"Sign in with Google",msg:"Google sign-in for RELJOB is being activated and will appear here shortly. In the meantime you can browse every job and subscribe with Mobile Money as normal — no account needed."})}>{GLOGO} Sign in with Google</button>))}
          {subscribed
            ? <span className="sub-pill">✓ Subscribed</span>
            : <button className="btn btn-primary" onClick={()=>setSubOpen({intent:"nav"})} style={{padding:"11px 22px"}}>Subscribe</button>}
          <button className="hamburger" aria-label="menu" onClick={()=>setMenu(m=>!m)}>{menu?"✕":"☰"}</button>
        </div>
        {menu&&(
          <div className="mobile-menu">
            <a onClick={()=>scrollTo("jobs")}>Jobs</a>
            <a onClick={()=>scrollTo("couples")}>Couples & Families</a>
            <a onClick={()=>scrollTo("single-mothers")}>Single Mothers</a>
            <a onClick={()=>scrollTo("how")}>How it works</a>
            <a onClick={()=>scrollTo("faq")}>FAQ</a>
            <a onClick={()=>{setMenu(false);setPostOpen(true);}} style={{color:"var(--accent-2)",fontWeight:700}}>Post a job (employers)</a>
          </div>
        )}
      </header>

      <main id="top">
        {/* ---------------- HERO ---------------- */}
        <section className="hero" style={{paddingTop:56}}>
          <div className="wrap hero-grid">
            <div>
              <span className="eyebrow">Relocation jobs · Zambia 🇿🇲 & Nigeria 🇳🇬 pilot</span>
              <h1 style={{marginTop:14}}>Your new life <span className="grad">abroad</span> starts here.</h1>
              <p className="sub">Verified relocation jobs across the world — with <b>flights, visa and housing arranged</b>. Real opportunities for hard-working people ready to build a better future.</p>
              <div className="hero-cta">
                <button className="btn btn-primary btn-lg" onClick={()=>scrollTo("jobs")}>Browse 10,000+ jobs →</button>
                <button className="btn btn-ghost btn-lg" onClick={()=>scrollTo("how")}>How it works</button>
              </div>
              <div className="flags"><span className="fl">🇿🇲</span><span className="fl">🇳🇬</span> Now open for applicants in Zambia & Nigeria</div>
              <div className="hero-stats">
                <div className="st"><b>10,000+</b><span>Open positions</span></div>
                <div className="st"><b>26,000+</b><span>ZMW / month</span></div>
                <div className="st"><b>75%</b><span>Include flight + visa</span></div>
              </div>
            </div>
            <div className="collage" aria-hidden="true">
              <div className="ph a"><SmartImg src={IMG(HERO_PHOTOS[0])} fb="👷🏾" /></div>
              <div className="ph b"><SmartImg src={IMG(HERO_PHOTOS[1])} fb="👩🏾‍🍳" /></div>
              <div className="ph c"><SmartImg src={IMG(HERO_PHOTOS[2])} fb="🤝" /></div>
              <div className="ph d"><SmartImg src={IMG(HERO_PHOTOS[3])} fb="😄" /></div>
              <div className="badge-float one"><span className="ic" style={{background:"#e6f5ee"}}>🏠</span><span>Housing included</span></div>
              <div className="badge-float two"><span className="ic" style={{background:"#e9edfb"}}>✈️</span><span>Flight + visa sorted</span></div>
            </div>
          </div>
        </section>

        {/* ---------------- TRUST ---------------- */}
        <div className="trust">
          <div className="wrap trust-inner">
            <div className="ti"><span className="ic">✅</span> Verified employers</div>
            <div className="ti"><span className="ic">✈️</span> Flights &amp; visa arranged</div>
            <div className="ti"><span className="ic">🏠</span> Housing options</div>
            <div className="ti"><span className="ic">👨‍👩‍👧</span> Couples &amp; families welcome</div>
            <div className="ti"><span className="ic">💳</span> Pay with Mobile Money</div>
          </div>
        </div>

        {/* ---------------- JOBS ---------------- */}
        <section id="jobs">
          <div className="wrap">
            <div className="sec-head">
              <span className="eyebrow">Open positions</span>
              <h2>Find the job that changes everything</h2>
              <p>Browse thousands of verified relocation jobs. Anyone can view the listings — a Mobile Money subscription unlocks the ability to apply and send your profile.</p>
            </div>

            {/* category chips */}
            <div className="cats" style={{marginBottom:22}}>
              <button className={"chip"+(cat==="all"?" on":"")} onClick={()=>setCat("all")}><span className="em">🌍</span>All jobs</button>
              {CATS.map(c=>(
                <button key={c.id} className={"chip"+(cat===c.id?" on":"")} onClick={()=>setCat(c.id)}>
                  <span className="em">{c.icon}</span>{c.name}
                </button>
              ))}
            </div>

            {/* filter bar */}
            <div className="filters">
              <div className="search-wrap">
                <span className="mag">🔍</span>
                <input className="inp" placeholder="Search job, employer or country…" value={q} onChange={e=>setQ(e.target.value)} />
              </div>
              <div className="field">
                <label>Destination</label>
                <select className="inp" value={country} onChange={e=>setCountry(e.target.value)}>
                  <option value="all">All countries</option>
                  {DEST.map(d=><option key={d.c} value={d.c}>{d.flag} {d.c}</option>)}
                </select>
              </div>
              <div className="field">
                <label>For</label>
                <select className="inp" value={ftype} onChange={e=>setFtype(e.target.value)}>
                  <option value="all">Everyone</option>
                  <option value="individual">Individuals</option>
                  <option value="couple">Couples</option>
                  <option value="single">Single mothers welcome</option>
                </select>
              </div>
              <div className="field" style={{flex:1}}>
                <label>Benefits</label>
                <div className="toggle-row">
                  <button className={"tgl"+(tFlight?" on":"")} onClick={()=>setTFlight(v=>!v)}>✈️ Flight + visa</button>
                  <button className={"tgl"+(tHouse?" on":"")} onClick={()=>setTHouse(v=>!v)}>🏠 Housing</button>
                  <button className={"tgl"+(tVac?" on":"")} onClick={()=>setTVac(v=>!v)}>🌴 Yearly home leave</button>
                </div>
              </div>
            </div>

            <div className="result-count">{fmt(filtered.length)} job{filtered.length!==1?"s":""} found</div>

            {filtered.length===0 ? (
              <div className="empty"><div className="big">🔍</div><b>No jobs match these filters</b><p>Try clearing a filter or search term.</p></div>
            ):(
              <React.Fragment>
                <div className="jobs-grid">
                  {filtered.slice(0,visible).map(j=>(
                    <JobCard key={j.id} job={j} subscribed={subscribed}
                      onView={()=>setDetail(j)} onApply={()=>onApplyClick(j)} />
                  ))}
                </div>
                {visible<filtered.length&&(
                  <div className="load-more">
                    <button className="btn btn-ghost btn-lg" onClick={()=>setVisible(v=>v+24)}>Load more jobs ({fmt(filtered.length-visible)} more)</button>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>
        </section>

        {/* ---------------- COUPLES ---------------- */}
        <section id="couples" className="alt">
          <div className="wrap prog">
            <div className="prog-media">
              <SmartImg src={IMG("photo-1521572163474-6864f9cf17ab")} fb="👨‍👩‍👧" />
            </div>
            <div className="prog-card">
              <span className="eyebrow">Couples &amp; families</span>
              <h2 style={{marginTop:10}}>Travel together. Work together. Build together.</h2>
              <p style={{color:"var(--ink-2)",marginTop:12}}>About 3 in 10 of our employers welcome couples who relocate together. You both get a job at the same place — and your family comes too.</p>
              <div className="benefit"><span className="bic">🏠</span><div><b>Housing included for the family</b><span>Couple positions always come with accommodation.</span></div></div>
              <div className="benefit"><span className="bic">👧</span><div><b>Children are welcome</b><span>Bring your kids with you — family life abroad, together.</span></div></div>
              <div className="benefit"><span className="bic">🎓</span><div><b>Education allowance</b><span>Extra support for education costs of children up to age 12.</span></div></div>
              <div className="benefit"><span className="bic">📝</span><div><b>One simple application for both partners</b><span>When you apply to a couple position we collect details for both of you.</span></div></div>
              <button className="btn btn-primary btn-lg" style={{marginTop:24}} onClick={()=>{setFtype("couple");scrollTo("jobs");}}>See couple positions →</button>
            </div>
          </div>
        </section>

        {/* ---------------- SINGLE MOTHERS ---------------- */}
        <section id="single-mothers">
          <div className="wrap prog">
            <div className="prog-card" style={{order:1}}>
              <span className="eyebrow">A program built for you</span>
              <h2 style={{marginTop:10}}>Single mothers — you are not alone in this.</h2>
              <p style={{color:"var(--ink-2)",marginTop:12}}>We know how much you carry. Our single-mother program treats you as an individual applicant, but gives you the <b>same family benefits couples receive</b> — so you can build a future for you and your children.</p>
              <div className="benefit"><span className="bic">🏠</span><div><b>Housing for you and your children</b><span>Accommodation support so your family stays together.</span></div></div>
              <div className="benefit"><span className="bic">🎓</span><div><b>Education allowance</b><span>Extra support for children up to age 12.</span></div></div>
              <div className="benefit"><span className="bic">🌴</span><div><b>Yearly home leave options</b><span>Selected employers cover a yearly trip home, flights included.</span></div></div>
              <div className="benefit"><span className="bic">💛</span><div><b>Priority guidance</b><span>Extra help through every step of your relocation.</span></div></div>
              <button className="btn btn-accent btn-lg" style={{marginTop:24}} onClick={()=>{setFtype("single");scrollTo("jobs");}}>See jobs that welcome single mothers →</button>
            </div>
            <div className="prog-media" style={{order:2}}>
              <SmartImg src={IMG("photo-1594744803329-e58b31de8bf5")} fb="👩🏾‍👧🏾" />
            </div>
          </div>
        </section>

        {/* ---------------- HOW ---------------- */}
        <section id="how" className="alt">
          <div className="wrap">
            <div className="sec-head" style={{marginInline:"auto",textAlign:"center"}}>
              <span className="eyebrow">Simple &amp; safe</span>
              <h2>How RELJOB works</h2>
              <p>Four steps from where you are today to a job that changes your family's future.</p>
            </div>
            <div className="steps">
              <div className="step"><div className="num">1</div><h3>Subscribe with Mobile Money</h3><p>Activate your membership in seconds using MTN, Airtel, Zamtel, OPay and more.</p></div>
              <div className="step"><div className="num">2</div><h3>Browse verified jobs</h3><p>Explore 10,000+ relocation positions with clear salary, housing and travel details.</p></div>
              <div className="step"><div className="num">3</div><h3>Send your profile</h3><p>Share your details, a photo and a short questionnaire — no CV needed.</p></div>
              <div className="step"><div className="num">4</div><h3>Get contacted</h3><p>Our relocation consultants review your profile and reach out to guide your next steps.</p></div>
            </div>
          </div>
        </section>

        {/* ---------------- TESTIMONIALS ---------------- */}
        <section>
          <div className="wrap">
            <div className="sec-head" style={{marginInline:"auto",textAlign:"center"}}>
              <span className="eyebrow">Real journeys</span>
              <h2>Hope, packed and delivered</h2>
              <p>People just like you who took the step — and never looked back.</p>
            </div>
            <div className="tgrid">
              {TESTI.map((t,i)=>(
                <div className="tcard" key={i}>
                  <div className="stars">{"★".repeat(t.r)}</div>
                  <p className="quote">“{t.q}”</p>
                  <div className="who">
                    <span className="tavatar" style={{background:t.color}}>{t.initials}</span>
                    <div><b>{t.name}</b><span>{t.role}</span><span className="origin">🇿🇲 From {t.from}, Zambia</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* ---------------- FAQ ---------------- */}
        <section id="faq" className="alt">
          <div className="wrap">
            <div className="sec-head" style={{marginInline:"auto",textAlign:"center"}}>
              <span className="eyebrow">Good to know</span>
              <h2>Questions &amp; answers</h2>
            </div>
            <div className="faq">
              <Faq q="Who can use RELJOB?">Right now we are running a pilot for applicants in Zambia 🇿🇲 and Nigeria 🇳🇬. Anyone can browse the jobs for free.</Faq>
              <Faq q="What am I paying for?">Browsing is free. Your Mobile Money membership is a <b>relocation service</b>: we <b>prepare and submit your profile (your application) to relevant opportunities on your behalf</b>, and our team personally guides you toward working abroad — documents, flight and visa. The listings are indicative opportunities that show you what the market looks like.</Faq>
              <Faq q="How do I pay?">With Mobile Money — MTN MoMo, Airtel Money, Zamtel Kwacha in Zambia, and MTN, Airtel, OPay, PalmPay and Paga in Nigeria.</Faq>
              <Faq q="Do I need a CV?">No formal CV needed. We ask for your personal details, a photo and a short work questionnaire, then <b>build your profile and submit it for you</b>. Simple and fast.</Faq>
              <Faq q="What about salary and housing?">Salaries start at 26,000 ZMW/month when housing is included, and from 46,000 ZMW/month when it is not (clearly marked on each job). Amounts vary by employer and role.</Faq>
              <Faq q="Can my partner and children come with me?">Yes. Around 30% of jobs welcome couples, with housing and children included, plus an education allowance for kids up to age 12. Single mothers receive these same family benefits.</Faq>
              <Faq q="Are flights and visa covered?">For about 75% of jobs the employer arranges the flight and visa, and 60% also offer a yearly paid trip home. Each job page shows exactly what's included.</Faq>
            </div>
          </div>
        </section>

        {/* ---------------- CTA ---------------- */}
        <section style={{paddingTop:0}}>
          <div className="wrap">
            <div className="cta-band">
              <h2>Your future is one application away.</h2>
              <p>Subscribe with Mobile Money and unlock 10,000+ relocation jobs today.</p>
              <div style={{marginTop:26,position:"relative"}}>
                {subscribed
                  ? <button className="btn btn-accent btn-lg" onClick={()=>scrollTo("jobs")}>Browse jobs →</button>
                  : <button className="btn btn-accent btn-lg" onClick={()=>setSubOpen({intent:"cta"})}>Subscribe with Mobile Money →</button>}
              </div>
            </div>
          </div>
        </section>

        {/* ---------------- EMPLOYERS ---------------- */}
        <section id="employers" style={{paddingTop:0}}>
          <div className="wrap">
            <div className="prog-card" style={{display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"space-between",gap:24}}>
              <div style={{maxWidth:"56ch"}}>
                <span className="eyebrow">For employers &amp; agencies</span>
                <h2 style={{fontSize:"clamp(24px,3vw,32px)",marginTop:10}}>Hiring abroad? Post a job ad.</h2>
                <p style={{color:"var(--ink-2)",marginTop:10}}>Reach thousands of motivated, work-ready candidates from Zambia &amp; Nigeria. Tell us about the role and we'll publish it — applications come straight to you.</p>
              </div>
              <button className="btn btn-primary btn-lg" onClick={()=>setPostOpen(true)}>📢 Post a job ad →</button>
            </div>
          </div>
        </section>

/* ---------------- Subscribe Modal ---------------- */
function SubscribeModal({ctx,onClose,onSuccess}){
  const [country,setCountry]=useState("zambia");
  const [prov,setProv]=useState(PROVIDERS.zambia[0].id);
  const [phone,setPhone]=useState("");
  const [stage,setStage]=useState("form"); // form|pending
  const [phoneErr,setPhoneErr]=useState(false);
  const plan=PLAN[country];
  const formRef=useRef(null);

  const [payErr,setPayErr]=useState("");

  async function submit(e){
    e.preventDefault();
    if(!phone.trim()||phone.replace(/\D/g,"").length<7){ setPhoneErr(true); return; }
    setPayErr("");
    // deliver the subscription lead to the single inbox (fire & forget)
    try{ formRef.current && formRef.current.submit(); }catch(_){}
    setStage("pending");

    // Charge the member for real. Zambia is wired to pawaPay; Nigeria is not
    // live yet, so it keeps the lead-only flow rather than faking a charge.
    const depositId=newDepositId();
    const outcome=await collectMembership({
      depositId, phone, provider:prov, amount:plan.price, country
    });

    if(outcome==="failed"){
      setStage("form");
      setPayErr("The payment was not completed. Check your phone and try again.");
      return;
    }
    if(outcome==="paid"){
      const rec=await activateMembership(depositId);
      if(!rec||!rec.active){
        setStage("form");
        setPayErr("We could not confirm the payment. Please try again or contact support.");
        return;
      }
      await saveMembership({membershipId:rec.membershipId,token:rec.token,
        country:plan.name,plan:plan.label+" "+plan.cur+"/month"});
      onSuccess();
      return;
    }
    // outcome === null: automatic collection unavailable (e.g. Nigeria, or the
    // backend is offline). The lead is already with the team, who follow up.
    onSuccess(outcome===null && country!=="zambia" ? {manual:true} : {manual:true});
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <button className="x" onClick={onClose} aria-label="Close">✕</button>
          <h3 className="mtitle">Activate your membership</h3>
          <p className="msub">{ctx&&ctx.intent==="apply"?"RELJOB relocation membership — one step and we'll submit your application and start guiding you.":"RELJOB relocation membership — we submit your profile to opportunities and guide you every step to work abroad."}</p>
        </div>
        <div className="modal-body">
          {stage==="form" ? (
            <div>
              <div className="country-tabs">
                <button type="button" className={"ctab"+(country==="zambia"?" on":"")} onClick={()=>{setCountry("zambia");setProv(PROVIDERS.zambia[0].id);}}>🇿🇲 Zambia</button>
                <button type="button" className={"ctab"+(country==="nigeria"?" on":"")} onClick={()=>{setCountry("nigeria");setProv(PROVIDERS.nigeria[0].id);}}>🇳🇬 Nigeria</button>
              </div>

              <div className="plan-row">
                <div className="plan on">
                  <div className="price">{plan.label}</div>
                  <div className="cur">{plan.cur} / month · relocation membership</div>
                </div>
              </div>

              <label style={{fontSize:13,fontWeight:700,color:"var(--ink-2)",display:"block",margin:"16px 0 8px"}}>Choose your Mobile Money provider</label>
              <div className="prov-grid">
                {PROVIDERS[country].map(p=>(
                  <button type="button" key={p.id} className={"prov"+(prov===p.id?" on":"")} onClick={()=>setProv(p.id)}>
                    <span className="lg">{p.lg}</span>{p.name}
                  </button>
                ))}
              </div>

              <div className="fld" style={{marginTop:16}}>
                <label>Mobile Money phone number</label>
                <input type="tel" inputMode="tel" style={phoneErr?{borderColor:"var(--accent-2)",boxShadow:"0 0 0 3px rgba(255,122,69,.15)"}:null}
                  placeholder={country==="zambia"?"e.g. 097 123 4567":"e.g. 0803 123 4567"} value={phone}
                  onChange={e=>{setPhone(e.target.value);setPhoneErr(false);}}
                  onKeyDown={e=>{if(e.key==="Enter")submit(e);}} required />
                {phoneErr && <span style={{fontSize:12.5,color:"var(--accent-2)",fontWeight:600}}>Please enter a valid Mobile Money number.</span>}
              </div>
              {payErr && <p style={{fontSize:13,color:"var(--accent-2)",fontWeight:700,marginTop:12}}>{payErr}</p>}

              <button className="btn btn-primary btn-block btn-lg" style={{marginTop:18}} type="button" onClick={submit}>
                Send payment request · {plan.label}/mo
              </button>
              <div className="secure">🔒 Secured with Mobile Money — no card needed</div>
              <p className="pay-note">You'll receive a prompt on your phone to approve the {plan.label} {plan.cur} payment with your Mobile Money PIN. This activates your RELJOB relocation membership — we submit your application to relevant opportunities and give you personal guidance. Listings are indicative, not guaranteed job offers.</p>

              {/* hidden lead-delivery form (routes to single inbox) */}
              <form ref={formRef} action={FORM_ENDPOINT} method="POST" target="goojob_sink" style={{display:"none"}}>
                <input type="hidden" name="_subject" value="🔔 New RELJOB subscription request" />
                <input type="hidden" name="_captcha" value="false" />
                <input type="hidden" name="_template" value="table" />
                <input type="hidden" name="Type" value="Subscription" />
                <input type="hidden" name="Country" value={plan.name} />
                <input type="hidden" name="Provider" value={prov} />
                <input type="hidden" name="Plan" value={plan.label+" "+plan.cur+"/month"} />
                <input type="hidden" name="Phone" value={phone} />
              </form>
            </div>
          ):(
            <div className="success-wrap">
              <div className="ring" style={{background:"#eef2fd",color:"var(--brand-2)"}}>
                <span className="spin">📲</span>
              </div>
              <h3>Check your phone</h3>
              <p>We sent a payment prompt to <b dir="ltr">{phone}</b>. Approve the {plan.label} {plan.cur} payment with your Mobile Money PIN to activate your membership…</p>
              <div style={{marginTop:18,color:"var(--muted)",fontSize:13,fontWeight:600}}>Waiting for confirmation…</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Apply Modal ---------------- */
function ApplyModal({job,user,onClose,onSuccess}){
  const isCouple=job.type==="couple";
  const [photo,setPhoto]=useState(null);
  const [photoUrl,setPhotoUrl]=useState(null);
  const [photoErr,setPhotoErr]=useState(false);
  const [sending,setSending]=useState(false);
  const formRef=useRef(null);

  function onPhoto(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    setPhoto(f); setPhotoErr(false); setPhotoUrl(URL.createObjectURL(f));
  }
  function submit(e){
    e.preventDefault();
    if(!photo){ setPhotoErr(true); return; }   // validate in JS (hidden file input can't use native required)
    setSending(true);
    try{ formRef.current.submit(); }catch(_){}
    // give the multipart POST a moment, then confirm
    setTimeout(()=>{ onSuccess(); },1400);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <button className="x" onClick={onClose} aria-label="Close">✕</button>
          <h3 className="mtitle">Apply — {job.title}</h3>
          <p className="msub">{job.employer} · {job.flag} {job.city}, {job.country}{isCouple?" · Couple position 👨‍👩‍👧":""}</p>
        </div>
        <div className="modal-body">
          <form ref={formRef} action={FORM_ENDPOINT} method="POST" target="goojob_sink" encType="multipart/form-data" onSubmit={submit}>
            <input type="hidden" name="_subject" value={"📄 New application · "+job.title+" · "+job.country} />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="Job" value={job.title} />
            <input type="hidden" name="Employer" value={job.employer} />
            <input type="hidden" name="Destination" value={job.city+", "+job.country} />
            <input type="hidden" name="Salary" value={fmt(job.salary)+" ZMW/month"+(job.housing?" (housing incl.)":" (no housing)")} />
            <input type="hidden" name="Position type" value={isCouple?"Couple":"Individual"} />

            <div className="form-grid">
              {isCouple && <div className="part-head"><span className="pn">1</span> Your details</div>}
              {user&&user.email && <input type="hidden" name="Google account email" value={user.email} />}
              <div className="fld"><label>Full name</label><input name="Full name" required placeholder="Your full name" defaultValue={user?user.name:""} /></div>
              <div className="fld"><label>Age</label><input name="Age" type="number" min="18" max="70" required placeholder="e.g. 29" /></div>
              <div className="fld"><label>Gender</label>
                <select name="Gender" required defaultValue=""><option value="" disabled>Select…</option><option>Female</option><option>Male</option></select>
              </div>
              <div className="fld"><label>WhatsApp / phone</label><input name="Phone" type="tel" required placeholder="e.g. 097 123 4567" /></div>
              <div className="fld"><label>Country</label>
                <select name="Applicant country" required defaultValue="Zambia"><option>Zambia</option><option>Nigeria</option></select>
              </div>
              <div className="fld"><label>City / town</label><input name="City" required placeholder="Where you live" /></div>
              <div className="fld"><label>Marital status</label>
                <select name="Marital status" required defaultValue=""><option value="" disabled>Select…</option><option>Single</option><option>Married / partnered</option><option>Single mother</option></select>
              </div>
              <div className="fld"><label>Children (under 12)</label><input name="Children under 12" type="number" min="0" max="12" defaultValue="0" /></div>

              {isCouple && (
                <React.Fragment>
                  <div className="part-head"><span className="pn">2</span> Your partner's details</div>
                  <div className="fld"><label>Partner full name</label><input name="Partner full name" required placeholder="Partner's full name" /></div>
                  <div className="fld"><label>Partner age</label><input name="Partner age" type="number" min="18" max="70" required placeholder="e.g. 30" /></div>
                  <div className="fld"><label>Partner gender</label>
                    <select name="Partner gender" required defaultValue=""><option value="" disabled>Select…</option><option>Female</option><option>Male</option></select>
                  </div>
                  <div className="fld"><label>Partner phone</label><input name="Partner phone" type="tel" placeholder="Optional" /></div>
                </React.Fragment>
              )}

              <div className="part-head"><span className="pn">✓</span> Work questionnaire</div>
              <div className="fld"><label>Main experience</label>
                <input name="Experience field" required placeholder={"e.g. "+job.catName} defaultValue={job.catName} />
              </div>
              <div className="fld"><label>Years of experience</label>
                <select name="Years of experience" required defaultValue=""><option value="" disabled>Select…</option><option>No experience</option><option>Less than 1 year</option><option>1–3 years</option><option>3–5 years</option><option>5+ years</option></select>
              </div>
              <div className="fld"><label>English level</label>
                <select name="English level" required defaultValue=""><option value="" disabled>Select…</option><option>Basic</option><option>Good</option><option>Fluent</option></select>
              </div>
              <div className="fld"><label>Do you have a passport?</label>
                <select name="Passport" required defaultValue=""><option value="" disabled>Select…</option><option>Yes, valid</option><option>Applied / in process</option><option>Not yet</option></select>
              </div>
              <div className="fld"><label>Available from</label><input name="Available from" type="month" /></div>
              <div className="fld"><label>Ready to relocate?</label>
                <select name="Ready to relocate" required defaultValue="Yes"><option>Yes</option><option>Within 3 months</option><option>Need more info</option></select>
              </div>
              <div className="fld full"><label>Why do you want this job?</label>
                <textarea name="Motivation" required placeholder="Tell us a little about yourself and why you'd be a great fit…"></textarea>
              </div>

              {/* photo (not a CV) */}

                {photoUrl? <img className="prev" src={photoUrl} alt="Your photo" /> : <span className="prev">📷</span>}
                <div className="t">
                  <b>{photo? "Photo added ✓" : (photoErr? "Please add a photo" : "Upload your photo")}</b>
                  <span>{photo? photo.name : "A clear photo of yourself (not a CV). JPG or PNG."}</span>
                </div>
                <input type="file" name="Applicant photo" accept="image/*" onChange={onPhoto} style={{display:"none"}} />
              </label>
            </div>

            <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={sending} style={{marginTop:20}}>
              {sending? "Sending your profile…" : "Send my profile to the relocation team →"}
            </button>
            <div className="secure">🔒 Your details are sent securely to our relocation team</div>
          </form>
        </div>
      </div>
    </div>
  );
}

        </div>
        <div className="modal-body">
          <form ref={formRef} action={FORM_ENDPOINT} method="POST" target="goojob_sink" onSubmit={submit}>
            <input type="hidden" name="_subject" value="📢 New RELJOB job-ad submission" />
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="Type" value="Job ad submission" />
            <div className="form-grid">
              <div className="part-head"><span className="pn">1</span> Employer details</div>
              <div className="fld"><label>Company / employer</label><input name="Company" required placeholder="Company or agency name" /></div>
              <div className="fld"><label>Contact person</label><input name="Contact person" required placeholder="Full name" /></div>
              <div className="fld"><label>Contact email</label><input name="Contact email" type="email" required placeholder="you@company.com" /></div>
              <div className="fld"><label>Contact phone / WhatsApp</label><input name="Contact phone" type="tel" required placeholder="Include country code" /></div>

              <div className="part-head"><span className="pn">2</span> Job details</div>
              <div className="fld"><label>Job title</label><input name="Job title" required placeholder="e.g. Live-in Caregiver" /></div>
              <div className="fld"><label>Category</label>
                <select name="Category" required defaultValue="">
                  <option value="" disabled>Select…</option>
                  {CATS.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
                </select>
              </div>
              <div className="fld"><label>Destination country</label>
                <select name="Country" required defaultValue="">
                  <option value="" disabled>Select…</option>
                  {DEST.map(d=><option key={d.c} value={d.c}>{d.flag} {d.c}</option>)}
                </select>
              </div>
              <div className="fld"><label>City</label><input name="City" required placeholder="City / town" /></div>
              <div className="fld"><label>Monthly salary (ZMW)</label><input name="Salary ZMW" type="number" min="26000" required placeholder="e.g. 46000" /></div>
              <div className="fld"><label>Number of positions</label><input name="Positions" type="number" min="1" defaultValue="1" /></div>
              <div className="fld"><label>Housing included?</label>
                <select name="Housing included" required defaultValue="Yes"><option>Yes</option><option>No</option></select>
              </div>
              <div className="fld"><label>Position type</label>
                <select name="Position type" required defaultValue="Individual"><option>Individual</option><option>Couple</option></select>
              </div>
              <div className="fld"><label>Flight + visa provided?</label>
                <select name="Flight and visa" required defaultValue="Yes"><option>Yes</option><option>No</option></select>
              </div>
              <div className="fld"><label>Yearly home leave?</label>
                <select name="Yearly home leave" required defaultValue="No"><option>Yes</option><option>No</option></select>
              </div>
              <div className="fld"><label>Children welcome?</label>
                <select name="Children welcome" required defaultValue="No"><option>Yes</option><option>No</option></select>
              </div>
              <div className="fld full"><label>Job description &amp; requirements</label>
                <textarea name="Description" required placeholder="Describe the role, duties, working hours, requirements and what you offer…"></textarea>
              </div>
            </div>
            <button className="btn btn-primary btn-block btn-lg" type="submit" disabled={sending} style={{marginTop:20}}>
              {sending? "Submitting…" : "Submit job ad for review →"}
            </button>
            <div className="secure">🔒 Reviewed by our team before it goes live</div>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ---------------- FAQ item ---------------- */
function Faq({q,children}){
  const [open,setOpen]=useState(false);
  return (
    <div className={"qa"+(open?" open":"")}>
      <button onClick={()=>setOpen(o=>!o)} aria-expanded={open}>{q}<span className="pm">+</span></button>
      <div className="ans"><p style={{padding:"2px 0"}}>{children}</p></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
